name: Publish Windows desktop

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-windows.yml
      - desktop/**
      - desktop_app.py
      - build_desktop.py
      - RE4GemOptimizer.spec
      - DESKTOP_README.txt
      - requirements-desktop.txt
      - re4_gems/**
      - tests/test_desktop.py
      - tests/test_build_desktop.py

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Test solver and desktop logic
        run: python -m pytest -q tests/test_optimizer.py tests/test_core_validation.py tests/test_desktop.py tests/test_build_desktop.py
      - name: Build Windows program
        run: python build_desktop.py
      - name: Verify public archive
        shell: pwsh
        run: |
          @'
          import zipfile
          with zipfile.ZipFile('dist/RE4GemOptimizer-public.zip') as archive:
              names = archive.namelist()
              assert archive.testzip() is None
              assert 'RE4GemOptimizer/RE4GemOptimizer.exe' in names
              assert not any('/assets/' in name and name.lower().endswith(('.png', '.jpg', '.jpeg', '.webp')) for name in names)
          '@ | python -
      - name: Publish release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $tag = "v1.0.$env:GITHUB_RUN_NUMBER"
          $body = @{
            tag_name = $tag
            target_commitish = $env:GITHUB_SHA
            name = "Windows desktop $tag"
            body = 'Windows 窗口版：下载 RE4GemOptimizer-public.zip，完整解压后双击 RE4GemOptimizer.exe。网页版请从仓库下载源码，详细步骤见 BEGINNER_GUIDE.md。发布包不包含游戏图片。'
            draft = $false
            prerelease = $false
          } | ConvertTo-Json -Compress
          $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -Body $body -ContentType 'application/json; charset=utf-8'
          $uploadUri = "$($release.upload_url.Split('{')[0])?name=RE4GemOptimizer-public.zip"
          $asset = Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -InFile 'dist/RE4GemOptimizer-public.zip' -ContentType 'application/zip'
          Write-Host "Release: $($release.html_url)"
          Write-Host "Asset: $($asset.browser_download_url)"
